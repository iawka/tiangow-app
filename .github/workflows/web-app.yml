# Publishes the offline web version (www/) to GitHub Pages.
# On iPhone: open the Pages link in Safari -> Share -> Add to Home Screen.
# Turn on once: repo Settings -> Pages -> Source: GitHub Actions.
name: Publish web app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['www/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
